# Elasticsearch + Kibana local cho Sprint 1 (MVP muc 5.1 - T1)
#
# Phien ban 8.18.8 duoc chon de KHOP voi Elasticsearch Java client 8.18.8
# ma Spring Boot 3.5.16 quan ly. Lech major giua client va server se loi.
#
#   docker compose up -d elasticsearch     # chi ES, nhe nhat
#   docker compose up -d                   # ES + Kibana
#   docker compose down                    # dung, GIU du lieu
#   docker compose down -v                 # dung va XOA du lieu

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: ca-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # chi chay local voi data mau, khong mo ra ngoai
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g          # may 15.7GB, Docker duoc cap 8.1GB -> 2g thoai mai
    ports:
      - "127.0.0.1:9200:9200"               # chi lang nghe tren localhost
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    container_name: ca-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
