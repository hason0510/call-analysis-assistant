# Elasticsearch + Kibana local cho Sprint 1 (MVP mục 5.1 - T1)
#
# Phiên bản 8.18.8 được chọn để KHỚP với Elasticsearch Java client 8.18.8
# mà Spring Boot 3.5.16 quản lý. Lệch major giữa client và server sẽ lỗi.
#
#   docker compose up -d elasticsearch     # chỉ ES, nhẹ nhất
#   docker compose up -d                   # ES + Kibana
#   docker compose down                    # dừng, GIỮ dữ liệu
#   docker compose down -v                 # dừng và XOÁ dữ liệu

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: ca-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # chỉ chạy local với data mẫu, không mở ra ngoài
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g          # máy 15.7GB, Docker được cấp 7.6GB -> 2g thoải mái
    ports:
      - "127.0.0.1:9200:9200"               # chi lang nghe tren localhost
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    container_name: ca-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
