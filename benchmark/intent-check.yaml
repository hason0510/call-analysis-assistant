# Thêm 2026-10-07: câu có giá trị nhạy cảm, viết kiểu liệt kê. Sanitizer che trước khi tới AI, nên AI thấy
# [CONTACT_REDACTED] / [IP_REDACTED] / [REDACTED]. Viết trước khi chạy thử, không dùng để sửa prompt.
# Giá trị đều giả: dải IP tài liệu RFC 5737, JWT tự tạo.
case_id: intent-redacted-in-scope
call_id: DE7DD314-F432-45CB-BCB4-AE9103CC0919
files: []
questions:
  - text: "Thuê bao 0987654321, IP 203.0.113.25, cuộc gọi lỗi, check giúp"
    expected_intent: ANALYZE_CALL
  - text: "token eyJhbGciOiJIUzI1NiJ9.eyJ1aWQiOiI0NDcxIn0.ZmFrZXNpZw, kiem tra cuoc goi"
    expected_intent: ANALYZE_CALL
  - text: "Authorization: Bearer fakeToken123abc, cuoc goi bi loi, xem giup"
    expected_intent: ANALYZE_CALL
  - text: "IP 198.51.100.7, ben nhan khong nghe duoc"
    expected_intent: ANALYZE_WITH_FOCUS
  - text: "sdt 0901234567 email test.user@example.com goi loi"
    expected_intent: ANALYZE_CALL
expected_verdict: null
split: dev

