# Benchmark `dev` (MVP mục 6.3) — đầu vào của Evaluation Runner (T9).
#
#   python scripts/benchmark-variants/make_variants.py ../ai20k_sample      # một lần: sinh biến thể F02
#   mvn spring-boot:run -Dspring-boot.run.arguments="--evaluate=benchmark/dev-cases.yaml --logs=../ai20k_sample"
#
# Mỗi case là một tài liệu YAML, cách nhau bằng `---`, đúng các trường của mẫu 6.3.
# Phần mở rộng, chờ mentor xác nhận (đều TUỲ CHỌN — file chỉ dùng mẫu 6.3 vẫn đọc được):
#   - Câu hỏi ghi được dạng `{text, expected_intent}` để đo Intent Accuracy (mục 6.5).
#     Câu chỉ là chuỗi → không tính vào Intent Accuracy.
#   - Case toàn câu OUT_OF_SCOPE bỏ trống `expected_verdict`: pipeline không được chạy.
#   - `files: []` hợp lệ: ca chỉ có Call-ID, không đính kèm file.
#
# Quy ước:
#   - `call_id` được runner truyền vào pipeline như khi người dùng ghi Call-ID trong câu hỏi (WebRTC log không
#     mang Call-ID; 5/13 cuộc chỉ có WebRTC log). Call-ID ghi trong câu hỏi vẫn được ưu tiên.
#   - `files` tên trần: tìm trong thư mục trùng `call_id`. Có dấu `/`: đường dẫn tương đối tới thư mục log.
#   - `expected_verdict` lấy từ thư mục `fail/` / `success/` — ground truth duy nhất mentor đưa. Riêng
#     case-018 (UNKNOWN) là đáp án suy từ luật "thiếu file → UNKNOWN" của MVP mục 4.1, không phải nhãn mentor.
#   - Trường ground truth không có (`expected_quality_flag`, `expected_issue_category`, `expected_evidence`)
#     để `null`, KHÔNG tự đặt nhãn. Runner báo metric tương ứng là N/A.
#   - Câu hỏi viết mới, viết TRƯỚC khi xem hệ thống trả lời; không trùng câu trong KeywordIntentClassifierTest
#     và ví dụ trong prompts/parse-request.system.txt (câu đã dùng để viết luật / prompt thì đo bị thổi phồng).
#   - Nhãn intent theo định nghĩa đã chốt (docs/sprint-2-tien-do.md, T4): câu chung về cuộc gọi (ổn không,
#     lỗi gì, vì sao thất bại) là ANALYZE_CALL; câu nêu một bên / triệu chứng / giai đoạn / chỉ số là
#     ANALYZE_WITH_FOCUS; nhờ làm việc khác là OUT_OF_SCOPE kể cả khi nhắc tới cuộc gọi.
#   - Viết câu để có MỘT nhãn duy nhất: câu ANALYZE_CALL chỉ hỏi về cuộc gọi nói chung (kết quả, thành công, ổn,
#     có lỗi, tổng quan); câu có tên một giai đoạn (đổ chuông, bắt máy, kết nối, KẾT THÚC, cúp máy), một bên,
#     một triệu chứng hay một chỉ số là ANALYZE_WITH_FOCUS. Câu đọc được cả hai nghĩa (ví dụ "kết thúc ra sao"
#     = kết cục, hay = giai đoạn kết thúc?) thì giữ dạng chuỗi trần, KHÔNG gắn nhãn: vẫn tính vào Verdict
#     Accuracy và Consistency, không tính vào Intent Accuracy (quyết định 2026-10-06).
#
# Độ phủ các ca MVP mục 6.3 yêu cầu:
#   SUCCESS bình thường     case-002, 009-014
#   SUCCESS chất lượng kém  KHÔNG CÓ — data mẫu không có cuộc nào có nhãn (Known Limitations)
#   FAIL thiết lập          case-004, 007
#   FAIL media (ICE/TURN)   case-001 (ICE), 005, 006, 008 (TURN)
#   UNKNOWN do thiếu file   case-018
#   Bình thường có WARN     mọi case SUCCESS: signaling của cả 7 cuộc có 5-13 event level=WARN
#   Thiếu file một bên      case-015 (và các cuộc vốn chỉ có log một bên: 001, 006, 008, 009)
#   Tên file sai loại       case-016; case-013 có sẵn file gõ sai tên `calleer_webrtc.log`
#   File khác Call-ID       case-017
#   OUT_OF_SCOPE (≥ 5)      case-003 (5 câu) + 2 câu xen trong case-010, case-012

