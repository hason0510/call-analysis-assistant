spring:
  application:
    name: call-analysis-assistant
  main:
    banner-mode: "off"
    web-application-type: none          # Sprint 1 chưa có web UI (MVP mục 1.5)
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s

logging:
  # Output là tiếng Việt có dấu (MVP mục 4.5). Ghim tường minh UTF-8 cho console
  # thay vì để Logback lấy charset mặc định của máy: trên Windows charset mặc định
  # có thể là bảng mã cũ, và khi đó mọi chữ có dấu bị thay bằng "?".
  charset:
    console: UTF-8
  level:
    root: WARN
    io.hason.callanalysis: INFO
  pattern:
    # %smsg / %sex: nội dung log và stack trace đi qua Sensitive Data Sanitizer (logback-spring.xml)
    # %skvp: trường key-value của SLF4J (request_id, latency_ms…) in sau thông điệp, đã làm sạch (Sprint 3 T5)
    console: "%d{HH:mm:ss} %-5level %-32logger{0} %smsg%skvp%n%sex"

# File Validator (Sprint 2 T3). File mẫu lớn nhất ~0,9 MB; file vượt giới hạn không được đọc
# nội dung, bị loại và nêu tên ở "Giới hạn dữ liệu".
call-analysis:
  files:
    max-size-per-file: 20MB

# File .env (springboot3-dotenv). Chép giá trị sang System properties vì SanitizerHolder đọc
# CALL_ANALYSIS_PSEUDONYM_KEY bằng System.getProperty, không qua Spring: Logback dùng sanitizer
# trước khi có bean nào (xem SanitizerHolder).
springdotenv:
  export-to-system-properties: true

# AI provider (Sprint 2). Key KHÔNG ghi ở đây: đặt biến môi trường OPENAI_API_KEY.
# Không có key thì mọi phân tích lùi về rule verdict, đánh dấu degraded.
ai:
  openai:
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    api-key: ${OPENAI_API_KEY:}
    timeout: 30s
    # Thử lại có kiểm soát (Sprint 3 T8): chỉ lỗi tạm thời (quá giờ, mạng, 5xx), tối đa 2 lần, trong ngân sách 45 s
    # cho cả một lời gọi — lần thử sau chỉ dùng phần ngân sách còn lại. Trình duyệt chờ 150 s (app.js) > tổng
    # ngân sách các bước: AI phân loại 45 s + Elasticsearch 5 + 30 s + AI phân tích 45 s = 125 s.
    retry:
      max-attempts: 2
      backoff: 500ms
      budget: 45s
      min-attempt-timeout: 2s
