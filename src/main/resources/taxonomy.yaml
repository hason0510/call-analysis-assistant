# Verdict & Issue Taxonomy (T5)
#
# Để ở dạng dữ liệu chứ không hard-code trong Java vì ba lý do:
#   - Mentor review được mà không cần đọc code.
#   - Sprint 2 nạp thẳng vào prompt cho AI.
#   - Đổi ngưỡng không phải build lại.
#
# Trường `calibration` ghi rõ điều kiện phát hiện đã được kiểm chứng trên data hay chưa.
# Tập data mẫu chỉ phủ 2/6 category, nên 4 category còn lại đang ở mức phỏng đoán và
# phải được ghi vào Known Limitations.

categories:

  - id: SIGNALING_FAILURE
    definition: >-
      Cuộc gọi không thiết lập được ở tầng signaling: server chưa từng gọi tới callee,
      hoặc phiên bị huỷ/từ chối trước khi hai bên bắt tay xong.
    symptoms:
      - "Chỉ có INIT_CALL, không bao giờ có INVITE"
      - "Xuất hiện FAIL_HARD"
      - "INVITE gửi lại nhiều lần rồi kết thúc bằng FAIL_HARD"
      - "Có CANCEL trước khi đạt OK_ACK_OK"
    requiredEvidence:
      - source: SIGNALING
        field: cmd
    detectionConditions:
      - "không tồn tại cmd=INVITE"
      - "tồn tại cmd=FAIL_HARD"
      - "tồn tại cmd=CANCEL và không tồn tại cmd=OK_ACK_OK"
    knownAmbiguity: >-
      CANCEL chưa rõ là người dùng chủ động huỷ hay hệ thống timeout rồi tự huỷ.
      Nếu là người dùng huỷ thì đây không phải lỗi hệ thống. Cần hỏi mentor.
    calibration:
      status: VALIDATED
      evidence: >-
        3 ca chắc chắn trong data có nhãn: 2 ca chỉ có INIT_CALL (1B009D42, D114749E),
        1 ca có FAIL_HARD (0EC7B700). Thêm 7 ca CANCEL nhưng mơ hồ.

  - id: ICE_FAILURE
    definition: >-
      Signaling bắt tay xong nhưng đường truyền media không thiết lập được:
      ICE chuyển sang failed và không bao giờ đạt connected.
    symptoms:
      - "IceConnectionState chuyển checking => failed"
      - "Gửi STUN BINDING request liên tục mà không nhận được response nào"
      - "Không có dòng 'Switching selected connection'"
      - "audio.bytesReceived = 0 và audio.bytesSent = 0"
      - "transport.hasMediaFail = 1"
    requiredEvidence:
      - source: WEBRTC
        field: iceStateTo
      - source: ENDCALL
        field: transport.hasMediaFail
    detectionConditions:
      - "iceStateTo=failed và không tồn tại iceStateTo=connected"
      - "transport.hasMediaFail=1"
      - "audio.bytesReceived=0 sau khi đã đạt OK_ACK_OK"
    knownAmbiguity: >-
      Timeout ICE mặc định khoảng 15 giây; cuộc gọi bị cúp máy trước mốc đó sẽ không
      kịp sinh trạng thái failed dù media thật sự không chạy.
      Theo RFC 8445, một cặp candidate hỏng KHÔNG có nghĩa phiên ICE hỏng, nên rule
      chỉ kết luận khi có failed mà CHƯA BAO GIỜ đạt connected.
      Giới hạn đã biết: tín hiệu iceEverConnected/iceEverFailed đang gộp chung cả hai
      leg của cuộc gọi. Nếu một bên đạt connected còn bên kia failed thì bất thường đó
      bị che. Data mẫu không có ca nào như vậy (2 dòng failed đều thuộc cùng một leg
      của 2D9057AA) nên chưa kiểm chứng được cách xử lý đúng.
    calibration:
      status: VALIDATED
      evidence: >-
        1 ca có nhãn: 2D9057AA. Signaling hoàn hảo (OK_ACK_OK + BYE + PAIR_PING đều 33 giây)
        nhưng ICE checking => failed sau 15,6 giây, 0 byte audio, codeReason=419
        "Vui lòng kiểm tra kết nối mạng", originator=2 (hệ thống tự ngắt).

  - id: TURN_FAILURE
    definition: >-
      Không cấp phát được relay trên TURN server, nên không có đường dự phòng khi
      kết nối trực tiếp thất bại.
    symptoms:
      - "TURN allocate thất bại liên tục trên MỌI cổng"
      - "Không có dòng 'TURN allocate requested successfully' nào"
      - "Không sinh được candidate loại relay"
    requiredEvidence:
      - source: WEBRTC
        field: message
    detectionConditions:
      - "có 'Received TURN allocate error response' mà KHÔNG có 'TURN allocate requested successfully' trên cùng một Port"
    knownAmbiguity: >-
      TUYỆT ĐỐI không được đếm riêng dòng lỗi. "Received TURN allocate error response
      code=401" là bước bắt tay xác thực chuẩn của TURN (RFC 8656): request đầu không kèm
      credential, server trả 401 kèm nonce, client gửi lại rồi mới được cấp.
      Trên toàn bộ data mẫu có 73 dòng error và ĐÚNG 73 dòng allocate thành công,
      không cổng nào thất bại hẳn. Đếm dòng lỗi sẽ báo nhầm 17/20 cuộc gọi,
      trong đó 7 thuộc nhóm success.
    calibration:
      status: UNVALIDATED
      evidence: >-
        KHÔNG có ca mẫu nào trong data. Điều kiện phát hiện viết theo suy luận từ
        vòng đời TURN, chưa kiểm chứng được.

  - id: NETWORK_PACKET_LOSS
    definition: >-
      Cuộc gọi thiết lập và chạy được nhưng mất gói đủ làm giảm chất lượng thoại.
    symptoms:
      - "audio.packetLostPercent cao kéo dài"
      - "audio.audioMos tụt"
      - "transport.hasMediaPoor = 1"
    requiredEvidence:
      - source: ENDCALL
        field: audio.packetLostPercent
      - source: ENDCALL
        field: audio.audioMos
    detectionConditions:
      - "audio.packetLostPercent > 5.0 kéo dài trên nhiều mẫu liên tiếp"
      - "audio.audioMos < 3.5"
      - "transport.hasMediaPoor=1 hoặc transport.countMediaPoor > 0"
    knownAmbiguity: >-
      Mất gói thoáng qua là bình thường. Phải xét CHUỖI mẫu #H7 chứ không chỉ đọc
      bản ghi #H9 cuối cùng — DE7DD314 có loss cuối = 0 nhưng từng lên 2,0% giữa cuộc gọi.
    calibration:
      status: UNVALIDATED
      evidence: >-
        KHÔNG có ca mẫu chất lượng kém. Đường nền đo được trên 399 mẫu stats của các
        cuộc gọi khoẻ mạnh: loss cao nhất 3,704%, MOS thấp nhất 4,335.
        Ngưỡng cảnh báo vì vậy phải đặt CAO HƠN 3,7% và MOS THẤP HƠN 4,3,
        nếu không sẽ gắn cờ nhầm cho cuộc gọi tốt. Con số 5.0 / 3.5 là phỏng đoán.

  - id: NETWORK_DELAY_JITTER
    definition: >-
      Độ trễ hoặc độ rung gói cao làm thoại bị ngắt quãng dù không mất gói đáng kể.
    symptoms:
      - "transport.currentRttMs cao kéo dài"
      - "audio.jitter cao"
    requiredEvidence:
      - source: ENDCALL
        field: transport.currentRttMs
      - source: ENDCALL
        field: audio.jitter
    detectionConditions:
      - "transport.currentRttMs > 300 kéo dài trên nhiều mẫu liên tiếp"
      - "audio.jitter > 0.050 (giây)"
    knownAmbiguity: >-
      Rất dễ trùng triệu chứng với NETWORK_PACKET_LOSS. Khi cả hai điều kiện cùng đúng,
      ưu tiên category có bằng chứng mạnh hơn.
      Lưu ý transport.rttMs là giá trị TÍCH LUỸ, không dùng để so với ngưỡng.
    calibration:
      status: UNVALIDATED
      evidence: >-
        KHÔNG có ca mẫu. Đường nền đo được: RTT cao nhất 181 ms (0/399 mẫu vượt 200 ms),
        jitter cao nhất 26 ms. Ngưỡng 300 ms / 50 ms là phỏng đoán, chỉ biết chắc
        phải cao hơn đường nền này.

  - id: UNKNOWN
    definition: >-
      Không đủ bằng chứng để kết luận nguyên nhân.
    symptoms:
      - "Thiếu file log của một hoặc cả hai bên"
      - "Bằng chứng từ các nguồn mâu thuẫn nhau"
      - "Bản export signaling bị cắt bớt"
    requiredEvidence: []
    detectionConditions:
      - "không xác định được bất kỳ category nào khác"
      - "thiếu nguồn log thiết yếu để kiểm chứng"
    knownAmbiguity: >-
      Trả UNKNOWN khi thiếu dữ liệu là đúng; đoán bừa khi không có căn cứ mới là lỗi nặng.
    calibration:
      status: VALIDATED
      evidence: >-
        Rất nhiều ca trong data: 9B556E56 chỉ có signaling + caller_webrtc, không có
        end call log nào.
