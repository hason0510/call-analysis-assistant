# Verdict & Issue Taxonomy (T5)
#
# Để ở dạng dữ liệu chứ không hard-code trong Java vì ba lý do:
#   - Mentor review được mà không cần đọc code.
#   - Sprint 2 nạp thẳng vào prompt cho AI.
#   - Đổi ngưỡng không phải build lại.
#
# Trường `calibration` ghi rõ điều kiện phát hiện đã được kiểm chứng trên data hay chưa.
# Tập data có nhãn phủ 3/6 category (SIGNALING_FAILURE, ICE_FAILURE, TURN_FAILURE); các
# category còn lại đang ở mức phỏng đoán và phải được ghi vào Known Limitations.

categories:

  - id: SIGNALING_FAILURE
    definition: >-
      Cuộc gọi không thiết lập được ở tầng signaling: server chưa từng gọi tới callee,
      hoặc phiên bị huỷ/từ chối trước khi hai bên bắt tay xong.
    symptoms:
      - "Chỉ có INIT_CALL, không bao giờ có INVITE"
      - "ACK của INIT_CALL mang callErrorCode (vd. 428 call.outgoing.error.privacy_restricted)"
      - "Xuất hiện FAIL_HARD"
      - "INVITE gửi lại nhiều lần rồi kết thúc bằng FAIL_HARD"
      - "Có CANCEL trước khi đạt OK_ACK_OK"
    requiredEvidence:
      - source: SIGNALING
        field: cmd
    detectionConditions:
      - "không tồn tại cmd=INVITE"
      - "tồn tại cmd=FAIL_HARD"
      - "tồn tại cmd=CANCEL và không tồn tại cmd=OK_ACK_OK"
    knownAmbiguity: >-
      Mã 428 privacy_restricted là server TỪ CHỐI theo chính sách của người nhận, không
      phải lỗi mạng; taxonomy MVP mục 4.2 không có category riêng nên xếp tạm vào đây —
      cần mentor xác nhận. Với CANCEL: 703100CF (cuộc CANCEL duy nhất của tập có nhãn có
      end call log) ghi `_waitingCandidateTimer with error` rồi `_emitFailed ... code: 421`,
      tức app TỰ huỷ khi hết `waitingCandidateTimeout` (6000 ms trong config của app);
      7B56D7AD và E9D6C112 không có end call log nên chưa thấy trực tiếp lý do huỷ. Nếu
      TURN không cấp phát được thì xếp TURN_FAILURE, còn TURN tốt mà vẫn hết giờ thì lỗi
      nằm ở phía client.
    calibration:
      status: VALIDATED
      evidence: >-
        Chỉ rút từ tập CÓ NHÃN (fail/ + success/). Tập for_test/ không dùng để hiệu
        chỉnh: đây là quy ước của dự án, áp dụng cùng tinh thần với MVP mục 6.3 (vốn chỉ
        cấm dùng kết quả held-out để tinh chỉnh) — for_test/ không có nhãn và dùng để đo mù.
        2 ca trong fail/: 1B009D42 và D114749E chỉ có INIT_CALL rồi im lặng. End call
        log của caller cho thấy lý do: ACK của INIT_CALL trả callErrorCode 428,
        key call.outgoing.error.privacy_restricted ("Người này hiện chưa thể nhận cuộc gọi").
        3 ca CANCEL trong fail/ (703100CF, 7B56D7AD, E9D6C112) trước đây xếp ở đây, nay
        chuyển sang TURN_FAILURE vì WebRTC log cho thấy TURN không cấp phát được.
        KHÔNG có ca FAIL_HARD nào trong tập có nhãn, nên nhánh đó chưa kiểm chứng được.

  - id: ICE_FAILURE
    definition: >-
      Signaling bắt tay xong nhưng đường truyền media không thiết lập được:
      ICE chuyển sang failed và không bao giờ đạt connected.
    symptoms:
      - "IceConnectionState chuyển checking => failed"
      - "Gửi STUN BINDING request liên tục mà không nhận được response nào"
      - "Không có dòng 'Switching selected connection'"
      - "audio.bytesReceived = 0 và audio.bytesSent = 0"
      - "transport.hasMediaFail = 1"
    requiredEvidence:
      - source: WEBRTC
        field: iceStateTo
      - source: ENDCALL
        field: transport.hasMediaFail
    detectionConditions:
      - "iceStateTo=failed và không tồn tại iceStateTo=connected"
      - "transport.hasMediaFail=1"
      - "audio.bytesReceived=0 sau khi đã đạt OK_ACK_OK"
    knownAmbiguity: >-
      Timeout ICE mặc định khoảng 15 giây; cuộc gọi bị cúp máy trước mốc đó sẽ không
      kịp sinh trạng thái failed dù media thật sự không chạy.
    calibration:
      status: VALIDATED
      evidence: >-
        1 ca có nhãn: 2D9057AA. Signaling hoàn hảo (OK_ACK_OK + BYE + PAIR_PING đều 33 giây)
        nhưng ICE checking => failed sau 15,6 giây, 0 byte audio, codeReason=419
        "Vui lòng kiểm tra kết nối mạng", originator=2 (hệ thống tự ngắt).
        Theo RFC 8445, một cặp candidate hỏng KHÔNG có nghĩa phiên ICE hỏng, nên rule chỉ
        kết luận khi có failed mà CHƯA BAO GIỜ đạt connected.
        Giới hạn đã biết: iceEverConnected/iceEverFailed gộp chung cả hai leg; nếu một bên
        đạt connected còn bên kia failed thì bất thường đó bị che. Data mẫu không có ca nào
        như vậy (2 dòng failed đều cùng một leg của 2D9057AA) nên chưa kiểm chứng được.

  - id: TURN_FAILURE
    definition: >-
      Không cấp phát được relay trên TURN server nào. Trong hệ thống này relay là đường
      MẶC ĐỊNH (iceTransportPolicy NOHOST), nên không có relay thì không có candidate để
      gói vào INVITE và cuộc gọi không bắt đầu được.
    symptoms:
      - "Không có dòng 'TURN allocate requested successfully' nào trong file WebRTC"
      - "Failed to create TURN client socket / Failed to send TURN message, error: 65 / TURN probe timeout liên tục"
      - "End call log: _waitingCandidateTimer with error, _emitFailed code 421 network_check"
      - "Signaling: INIT_CALL rồi CANCEL, không bao giờ có INVITE"
    requiredEvidence:
      - source: WEBRTC
        field: message
    detectionConditions:
      - "một file WebRTC có sự kiện TURN nhưng KHÔNG có 'TURN allocate requested successfully' nào, và cuộc gọi chưa từng có INVITE"
    knownAmbiguity: >-
      Không được đếm riêng dòng lỗi allocate: "TURN allocate error response code=401"
      là bước bắt tay xác thực chuẩn của TURN (RFC 8656), không phải lỗi.
    calibration:
      status: VALIDATED
      evidence: >-
        Chỉ rút từ tập CÓ NHÃN. 3 ca trong fail/ thoả điều kiện: 703100CF (8 lần
        'Failed to create TURN client socket', máy có giao diện VPN tun0), 7B56D7AD
        (40 lần 'Failed to send TURN message, error: 65'), E9D6C112 (40 lần TURN probe
        timeout); cả 3 đều 0 lần allocate thành công, WebRTC log chỉ dài khoảng 6 giây,
        signaling INIT_CALL rồi CANCEL. 703100CF có end call log xác nhận mã 421.
        0/13 file WebRTC của success/ và 0/1 file của 2D9057AA thoả điều kiện: mọi file
        đó đều có ít nhất 2 lần allocate thành công.
        Không được đếm dòng lỗi riêng lẻ: 'Received TURN allocate error response' (401)
        là bắt tay chuẩn (73 error, đúng 73 thành công ở các file TURN chạy được); đếm
        dòng này sẽ báo nhầm 11/20 cuộc gọi, gồm cả 7/7 cuộc thành công. Probe timeout lẻ
        tẻ cũng có ở cuộc gọi thành công.

  - id: NETWORK_PACKET_LOSS
    definition: >-
      Cuộc gọi thiết lập và chạy được nhưng mất gói đủ làm giảm chất lượng thoại.
    symptoms:
      - "audio.packetLostPercent cao kéo dài"
      - "audio.audioMos tụt"
      - "transport.hasMediaPoor = 1"
    requiredEvidence:
      - source: ENDCALL
        field: audio.packetLostPercent
      - source: ENDCALL
        field: audio.audioMos
    detectionConditions:
      - "audio.packetLostPercent > 5.0 kéo dài trên nhiều mẫu liên tiếp"
      - "audio.audioMos < 3.5"
      - "transport.hasMediaPoor=1 hoặc transport.countMediaPoor > 0"
    knownAmbiguity: >-
      Mất gói thoáng qua là bình thường. Phải xét CHUỖI bản ghi stats chứ không chỉ đọc
      bản ghi summary (endcall) cuối cùng — DE7DD314 có loss cuối = 0 nhưng từng lên 2,0% giữa cuộc gọi.
    calibration:
      status: UNVALIDATED
      evidence: >-
        KHÔNG có ca mẫu chất lượng kém trong tập có nhãn. Đường nền đo được trên 844 mẫu stats của 6 leg thuộc success/:
        loss cao nhất 3,704%, MOS thấp nhất 4,335.
        Ngưỡng cảnh báo vì vậy phải đặt CAO HƠN 3,7% và MOS THẤP HƠN 4,3,
        nếu không sẽ gắn cờ nhầm cho cuộc gọi tốt. Con số 5.0 / 3.5 là phỏng đoán.

  - id: NETWORK_DELAY_JITTER
    definition: >-
      Độ trễ hoặc độ rung gói cao làm thoại bị ngắt quãng dù không mất gói đáng kể.
    symptoms:
      - "transport.currentRttMs cao kéo dài"
      - "audio.jitter cao"
    requiredEvidence:
      - source: ENDCALL
        field: transport.currentRttMs
      - source: ENDCALL
        field: audio.jitter
    detectionConditions:
      - "transport.currentRttMs > 300 kéo dài trên nhiều mẫu liên tiếp"
      - "audio.jitter > 0.050 (giây)"
    knownAmbiguity: >-
      Rất dễ trùng triệu chứng với NETWORK_PACKET_LOSS. Khi cả hai điều kiện cùng đúng,
      ưu tiên category có bằng chứng mạnh hơn.
      Lưu ý transport.rttMs là giá trị TÍCH LUỸ, không dùng để so với ngưỡng.
    calibration:
      status: UNVALIDATED
      evidence: >-
        KHÔNG có ca mẫu. Đường nền đo được trên 844 mẫu stats của 6 leg thuộc success/: RTT cao nhất 266 ms
        (2/844 mẫu vượt 200 ms, đều ở callee 70A1F889), jitter cao nhất 28 ms. Ngưỡng 300 ms / 50 ms là phỏng đoán, chỉ biết chắc
        phải cao hơn đường nền này.

  - id: UNKNOWN
    definition: >-
      Không đủ bằng chứng để kết luận nguyên nhân.
    symptoms:
      - "Thiếu file log của một hoặc cả hai bên"
      - "Bằng chứng từ các nguồn mâu thuẫn nhau"
      - "Bản export signaling bị cắt bớt"
    requiredEvidence: []
    detectionConditions:
      - "không xác định được bất kỳ category nào khác"
      - "thiếu nguồn log thiết yếu để kiểm chứng"
    knownAmbiguity: >-
      Trả UNKNOWN khi thiếu dữ liệu là đúng; đoán bừa khi không có căn cứ mới là lỗi nặng.
    calibration:
      status: VALIDATED
      evidence: >-
        Rất nhiều ca trong data: 9B556E56 chỉ có signaling + caller_webrtc, không có
        end call log nào.
