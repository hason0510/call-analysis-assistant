# Profile "web": Chat API + Web UI (Sprint 2 T1, T2).
#   mvn spring-boot:run -Dspring-boot.run.profiles=web
# Không bật profile này thì app chạy kiểu CLI như Sprint 1 (web-application-type: none).
spring:
  main:
    web-application-type: servlet
  servlet:
    multipart:
      # Giới hạn của multipart phải LỚN hơn call-analysis.files.max-size-per-file (20 MB): file quá cỡ
      # cần tới được File Validator để bị loại RIÊNG và nêu tên ở "Giới hạn dữ liệu" (MVP mục 6.4, F04).
      # Multipart chặn trước thì cả request hỏng, người dùng không biết file nào gây lỗi.
      max-file-size: 100MB
      max-request-size: 300MB

server:
  port: 8081

# Log JSON có làm sạch (Sprint 3 T5, MVP 7.1 "structured log"). logback-spring.xml chỉ dùng định dạng này ở profile web;
# thêm profile "plain-log" để xem log chữ.
logging:
  structured:
    format:
      console: io.hason.callanalysis.infrastructure.logging.SanitizedJsonLogFormatter

# Ghi bản ghi mỗi request vào Elasticsearch, index analysis-requests, để xem trên Kibana (Sprint 3 T9). Chỉ bật ở
# profile web: lượt benchmark và lệnh CLI không ghi. Bản ghi chỉ có mã, số, cờ — không chữ tự do.
call-analysis:
  request-log:
    enabled: true
